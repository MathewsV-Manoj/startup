name: Build test APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Reuse one debug signing key across builds, so a new APK installs over the
      # previous one and the phone keeps the permissions already granted to Focuno.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: focuno-debug-keystore-v1

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish APK to the fixed download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk focuno-debug.apk
          gh release delete focuno-debug --yes --cleanup-tag || true
          gh release create focuno-debug focuno-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Focuno test build" \
            --notes "Debug build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. For testing on your own phone only."
